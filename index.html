<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Blessing 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #e8457c;
      --accent-soft: #f2668f;
      --gold: #f7b733;
      --bg-a: #ffd3a5;
      --bg-b: #fd6585;
      --bg-c: #c084fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, var(--bg-a), var(--bg-b), var(--bg-c));
      background-size: 300% 300%;
      animation: bgShift 12s ease infinite;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 16px;
    }

    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Floating balloons and sparkles in the background */
    .floaters {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floater {
      position: absolute;
      bottom: -50px;
      opacity: 0;
      animation: floatUp linear forwards;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-8deg); opacity: 0; }
      10% { opacity: 0.9; }
      50% { transform: translateY(-55vh) rotate(8deg); }
      90% { opacity: 0.7; }
      100% { transform: translateY(-115vh) rotate(-8deg); opacity: 0; }
    }

    /* Confetti on opening the gift */
    .confetti {
      position: fixed;
      top: -20px;
      z-index: 30;
      pointer-events: none;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.8; }
    }

    /* Split Screen Halves */
    .split-screen {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 10;
      pointer-events: none;
    }

    .split-left, .split-right {
      width: 50vw;
      height: 100%;
      background: linear-gradient(135deg, var(--bg-a), var(--bg-b));
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .split-left { box-shadow: inset -8px 0 20px rgba(0, 0, 0, 0.12); }
    .split-right { box-shadow: inset 8px 0 20px rgba(0, 0, 0, 0.12); }

    .split-left.open { transform: translateX(-100%); }
    .split-right.open { transform: translateX(100%); }

    /* Hidden cake underneath */
    .reveal-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      text-align: center;
      opacity: 0;
      transform: scale(0.5);
      transition: all 1s ease 0.6s;
      padding: 0 16px;
    }

    .reveal-container.show {
      opacity: 1;
      transform: scale(1);
      z-index: 20;
    }

    .cake {
      font-size: clamp(60px, 18vw, 96px);
      animation: bounce 1.6s infinite ease-in-out;
      margin-bottom: 18px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    .reveal-message {
      color: var(--accent);
      font-family: "Dancing Script", cursive;
      font-size: clamp(26px, 7vw, 38px);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.94);
      padding: 18px 30px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      max-width: 520px;
    }

    .reveal-sub {
      margin-top: 16px;
      color: #fff;
      font-size: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 36px 32px;
      border-radius: 24px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(150, 40, 120, 0.3);
      animation: fadeIn 1.5s ease;
      z-index: 20;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    @keyframes wiggle {
      0% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(-4deg) scale(1.03); }
      30% { transform: rotate(4deg) scale(1.03); }
      45% { transform: rotate(-3deg) scale(1.02); }
      60% { transform: rotate(3deg) scale(1.02); }
      75% { transform: rotate(-1deg) scale(1.01); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .shake { animation: wiggle 0.8s ease-in-out; }

    h1 {
      color: var(--accent);
      margin: 0 0 6px;
      font-family: "Dancing Script", cursive;
      font-size: 36px;
      font-weight: 700;
    }

    .to {
      color: #b07a8a;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 18px;
    }

    .message {
      color: #555;
      font-size: 15px;
      line-height: 1.7;
      min-height: 9em;
      margin: 0;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .signature {
      font-family: "Dancing Script", cursive;
      color: var(--accent);
      font-size: 22px;
      margin-top: 12px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .buttons {
      margin-top: 18px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.8s ease;
      pointer-events: none;
    }

    .visible { opacity: 1 !important; transform: none !important; pointer-events: auto; }

    button {
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-family: inherit;
      border-radius: 30px;
      cursor: pointer;
      margin: 8px;
      transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
    }

    button:active { transform: scale(0.95); }

    .gift {
      background: var(--accent);
      color: white;
      box-shadow: 0 6px 18px rgba(232, 69, 124, 0.4);
      animation: pulse 2s infinite;
    }

    .gift:hover { background: var(--accent-soft); transform: translateY(-2px); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 18px rgba(232, 69, 124, 0.4); }
      50% { box-shadow: 0 6px 28px rgba(232, 69, 124, 0.75); }
    }

    .wish { background: #fff3d6; color: #8a5a00; }
    .wish:hover { background: #ffe9b3; transform: translateY(-2px); }

    .wish-note {
      margin-top: 14px;
      color: #8a6b75;
      font-size: 14px;
      line-height: 1.6;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.6s ease;
    }

    .wish-note.visible { max-height: 200px; }

    @keyframes fadeIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 420px) {
      .card { padding: 28px 20px; }
      h1 { font-size: 32px; }
      .message { font-size: 14px; }
      button { padding: 11px 20px; font-size: 15px; margin: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <div class="floaters" id="floaters"></div>

  <!-- Hidden cake revealed when the gift opens -->
  <div class="reveal-container" id="revealContainer">
    <div class="cake">🎂🎁🎉</div>
    <div class="reveal-message">Happy Birthday, Blessing! 🥳 Here's to your best year yet! 💖</div>
    <div class="reveal-sub">You deserve all the happiness in the world.</div>
  </div>

  <div class="split-screen">
    <div class="split-left" id="splitLeft"></div>
    <div class="split-right" id="splitRight"></div>
  </div>

  <div class="card" id="mainCard">
    <h1>🎈 Happy Birthday 🎈</h1>
    <p class="to">For Blessing</p>
    <p class="message" id="message"><span class="cursor"></span></p>
    <div class="signature" id="signature">— with love and warm wishes 💛</div>

    <div class="buttons" id="buttons">
      <button class="gift" id="giftBtn">Open your gift 🎁</button>
      <button class="wish" id="wishBtn">Make a wish ✨</button>
    </div>

    <div class="wish-note" id="wishNote">
      Close your eyes, make your wish… 🕯️ I hope every single one of your
      wishes comes true this year!
    </div>
  </div>

  <script>
    const text = "Happy Birthday, Blessing! Today is all about you: your kindness, your laughter, and the light you bring to everyone around you. May this new year of your life be filled with joy, good health, love, and every dream your heart is holding. You truly are a blessing, just like your name. Enjoy every moment of your special day!";

    const messageEl = document.getElementById("message");
    const signature = document.getElementById("signature");
    const buttons = document.getElementById("buttons");
    const giftBtn = document.getElementById("giftBtn");
    const wishBtn = document.getElementById("wishBtn");
    const wishNote = document.getElementById("wishNote");
    const mainCard = document.getElementById("mainCard");
    const splitLeft = document.getElementById("splitLeft");
    const splitRight = document.getElementById("splitRight");
    const revealContainer = document.getElementById("revealContainer");
    const floatersEl = document.getElementById("floaters");

    // Typewriter effect for the message (tap the card to skip)
    let i = 0;
    let typing = true;
    function finishTyping() {
      typing = false;
      messageEl.textContent = text;
      signature.classList.add("visible");
      setTimeout(() => buttons.classList.add("visible"), 400);
    }
    function type() {
      if (!typing) return;
      if (i <= text.length) {
        messageEl.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
        i++;
        setTimeout(type, 32);
      } else {
        finishTyping();
      }
    }
    setTimeout(type, 1200);
    mainCard.addEventListener("click", (e) => {
      if (typing && e.target.tagName !== "BUTTON") finishTyping();
    });

    // Floating balloons and sparkles in the background
    const floaterChars = ["🎈", "🎈", "🎈", "✨", "🎉", "💖", "⭐"];
    function spawnFloater() {
      const f = document.createElement("span");
      f.className = "floater";
      f.textContent = floaterChars[Math.floor(Math.random() * floaterChars.length)];
      f.style.left = Math.random() * 100 + "vw";
      f.style.fontSize = 18 + Math.random() * 26 + "px";
      f.style.animationDuration = 7 + Math.random() * 6 + "s";
      floatersEl.appendChild(f);
      setTimeout(() => f.remove(), 14000);
    }
    setInterval(spawnFloater, 600);

    // Confetti burst
    const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#118ab2", "#c084fc", "#ff9f1c", "#ffffff"];
    function confetti(count) {
      for (let n = 0; n < count; n++) {
        setTimeout(() => {
          const c = document.createElement("span");
          c.className = "confetti";
          const size = 6 + Math.random() * 8;
          c.style.width = size + "px";
          c.style.height = size * (0.4 + Math.random() * 0.8) + "px";
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.left = Math.random() * 100 + "vw";
          c.style.animationDuration = 2.5 + Math.random() * 3 + "s";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 6000);
        }, n * 25);
      }
    }

    giftBtn.addEventListener("click", () => {
      mainCard.classList.add("shake");
      setTimeout(() => {
        mainCard.style.display = "none";
        splitLeft.classList.add("open");
        splitRight.classList.add("open");
        revealContainer.classList.add("show");
        confetti(150);
        setInterval(() => confetti(20), 2500);
      }, 800);
    });

    wishBtn.addEventListener("click", () => {
      wishNote.classList.add("visible");
      wishBtn.textContent = "Wish made 🌟";
      confetti(30);
    });
  </script>

</body>
</html>
